name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Syntax check
        run: python -m compileall -q app scripts
      - name: Run test suite
        run: python -m pytest tests -q
        env:
          # tests are fully offline: no GLM/Telegram/network calls, no secrets needed
          CI: "true"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA::7} -t akhbot-app:ci .

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}مدیریت{% endblock %} — {{ brand.short_name }} admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin">
{% if session_ok is not defined %}{% set session_ok = true %}{% endif %}
<header class="admin-header">
  <a href="/admin">داشبورد</a>
  <a href="/admin/sources">منابع</a>
  <a href="/admin/items">مواد خام</a>
  <a href="/admin/events">رویدادها</a>
  <a href="/admin/publications">انتشارها</a>
  <a href="/admin/media">مدیا</a>
  <a href="/admin/platforms">پلتفرم‌ها</a>
  <a href="/admin/health">سلامت ۲۴/۷</a> · <a href="/admin/intake">ورودی دستی</a> · <a href="/admin/ai">هوش مصنوعی</a> · <a href="/admin/settings">تنظیمات</a>
  <a href="/" target="_blank">سایت</a>
  <form method="post" action="/admin/logout" class="inline-form">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <button type="submit">خروج</button>
  </form>
</header>
{% if preview_mode %}<div class="preview-banner">پیش‌نمایش — برند نهایی: UNDECIDED</div>{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>

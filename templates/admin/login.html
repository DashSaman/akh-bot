<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ورود مدیر — {{ brand.short_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin login-page">
<main class="login-box">
  <h1>ورود به مدیریت {{ brand.name_fa }}</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>نام کاربری <input name="username" autocomplete="username" required></label>
    <label>گذرواژه <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">ورود</button>
  </form>
</main>
</body>
</html>
